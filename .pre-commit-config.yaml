repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: mdformat
        name: Markdown format
        entry: uv run --locked mdformat
        language: system
        types: [markdown]
      - id: check-yaml
        name: Check YAML
        entry: uv run --locked python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run --locked python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --locked python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
