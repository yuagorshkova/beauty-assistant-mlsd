[project]
name = "beauty-assistant-mlsd"
version = "0.1.0"
description = "ML System Design for a conversational beauty assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mdformat>=0.7.22,<2",
    "mdformat-gfm>=0.4.1,<1",
    "pre-commit>=4.3.0,<5",
    "pre-commit-hooks>=5.0.0,<7",
    "ruff>=0.14.3,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mdformat]
wrap = 100
